<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Civitai + HF Downloader — standalone</title>
<style>
  :root{
    --bg:#000; --bg1:#0a0a0a; --bg2:#111; --line:rgba(255,255,255,.09);
    --line2:rgba(255,255,255,.16); --txt:#f0f0f0; --dim:#999; --mute:#666;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--txt);font:13px/1.5 var(--font);
       display:flex;flex-direction:column}

  header{padding:12px 18px;border-bottom:1px solid var(--line2);
         background:linear-gradient(180deg,#0d0d0e,#080809);
         display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  header h1{margin:0;font-size:15px;font-weight:650;letter-spacing:-.01em}
  header .sub{font-size:11.5px;color:var(--mute)}
  header code{font:11px ui-monospace,Menlo,monospace;color:#8fd6a2}

  main{flex:1;display:flex;min-height:0}

  /* the rail stands in for ComfyUI's sidebar */
  #civ-rail{width:150px;flex:0 0 150px;border-right:1px solid var(--line2);
            background:#080809;padding:10px 8px;display:flex;flex-direction:column;gap:4px}
  .civ-rail-btn{appearance:none;text-align:left;border:1px solid transparent;
    background:transparent;color:var(--dim);font:600 12px var(--font);
    padding:9px 10px;border-radius:7px;cursor:pointer;transition:.15s}
  .civ-rail-btn:hover{color:var(--txt);background:rgba(255,255,255,.04)}
  .civ-rail-btn.active{color:var(--txt);background:rgba(255,255,255,.06);
    border-color:var(--line2)}

  #civ-stage{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
  /* ComfyUI hands the extension a plain element and it fills itself */
  #civ-stage>*{flex:1;min-height:0}

  #boot{padding:40px;color:var(--mute);font-size:13px}
  #boot.error{color:#f88;white-space:pre-wrap;font:12px ui-monospace,Menlo,monospace}
</style>
</head>
<body>

<header>
  <h1>Civitai + Hugging Face Downloader</h1>
  <span class="sub">running standalone — no ComfyUI &middot;
    real backend, real frontend, <code>standalone/shim</code> stands in for
    <code>folder_paths</code> and <code>PromptServer</code></span>
</header>

<main>
  <nav id="civ-rail"></nav>
  <div id="civ-stage"><div id="boot">Loading&hellip;</div></div>
</main>

<script type="module">
  const boot = document.getElementById("boot");
  window.addEventListener("error", function (e) {
    boot.className = "error";
    boot.textContent = "Failed to start:\n\n" + (e.error && e.error.stack || e.message);
  });

  // This is the same entry point ComfyUI loads as the extension's WEB_DIRECTORY
  // script. It imports ../../scripts/app.js and ../../scripts/api.js, which
  // the server maps to the shims in standalone/web/scripts/.
  import("/js/civitai.js").then(function () {
    if (boot && boot.parentNode) boot.parentNode.removeChild(boot);
  }).catch(function (e) {
    boot.className = "error";
    boot.textContent = "Could not load /js/civitai.js:\n\n" + (e && e.stack || e);
  });
</script>

</body>
</html>
